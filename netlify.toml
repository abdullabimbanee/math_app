[build]
  command = """
    git clone https://github.com/flutter/flutter.git -b stable &&
    export PATH="$PATH:$PWD/flutter/bin" &&
    flutter config --enable-web &&
    flutter build web --release
  """
  publish = "build/web"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "18"